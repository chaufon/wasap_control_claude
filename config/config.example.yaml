# Copy this file to ~/.config/claude-orchestrator/config.yaml (or set
# CLAUDE_ORCHESTRATOR_CONFIG to point elsewhere) and fill in your own
# values. Read by both the Python orchestrator and the Node bridge
# (SPEC.md §8).

whatsapp:
  # Your own phone-number-form WhatsApp JID, e.g. "51987654321@s.whatsapp.net"
  # — the bridge logs it as the "pn" field of { pn, lid } the first time you
  # send yourself a message after pairing. Use "pn" here, not "lid": it's
  # also the address the bridge sends replies to. WhatsApp addresses
  # self-chat messages under either identity depending on which client sent
  # them (phone app -> lid, Desktop/Web -> pn); the bridge already accepts
  # both automatically, so only "pn" needs to be configured here (SPEC.md §4.1).
  allowed_sender_jid: "REPLACE_ME@s.whatsapp.net"

projects:
  - name: wasap-grill-me
    path: /home/centos/PycharmProjects/wasap_grill_me
  # - name: another-project
  #   path: /home/centos/PycharmProjects/another-project

# Optional. Every immediate, non-hidden folder under here is automatically
# an available project (SPEC.md §7.2) — switch with /project <name-or-number>,
# no registration needed, discovered live each time. Also the only tree
# /create is allowed to make new folders in (folder names validated against
# a safe charset, no slashes/".."). Leave unset to only use the static
# `projects` list above and disable /create.
project_root: /home/centos/PycharmProjects

# Optional. Folders under project_root, as relative paths, that hold
# projects instead of being one (SPEC.md §7.2). Each is scanned one level
# deep; its projects are named by relative path (c/whey, c/car/maintenance)
# and /create c/newapp works inside it. A nested container (c/car) is
# only scanned when its parent (c) is listed too. Read at startup —
# restart after changing it.
# project_containers:
#   - c
#   - c/car

claude_code:
  # Must be an absolute path: systemd --user units don't reliably inherit
  # a PATH containing ~/.local/bin (it depends on when the user manager's
  # environment gets updated relative to service start), so a bare "claude"
  # can resolve at some boots and fail at others. `which claude` prints the
  # current target.
  binary: /home/centos/.local/bin/claude
  # Hard timeout per task; after this the process is killed and the
  # request is treated as a failure (SPEC.md §5.7).
  task_timeout_seconds: 900

# Remote Control server that /project and /create start for each project, so
# it shows up in the Claude app's Code tab (SPEC.md §7.7). Uses
# claude_code.binary above. Needs tmux.
remote_control:
  # acceptEdits | auto | bypassPermissions | default | dontAsk | plan.
  # bypassPermissions never asks, like the claude -p path. auto asks about
  # actions its safety check flags. default asks for every edit.
  permission_mode: bypassPermissions
  # same-dir: every session works in the project folder itself.
  # worktree: each new session gets its own git worktree (git repos only).
  spawn: same-dir
  # Claude in Chrome for spawned sessions. false: browser work goes through
  # the Playwright MCP plugin, not your real, logged-in Chrome.
  chrome: false

whisper:
  model: large-v3
  device: cuda
  fallback_device: cpu
  fallback_model: medium

# Voice replies via /voice on (SPEC.md §7.4), off by default. Piper voice
# models download automatically on first use (like whisper's above) into
# tts.models_dir. langdetect picks which of these voices to use per reply,
# based on the reply's own language — not the input message's language, and
# not a static config default. Any detected language without an entry here
# falls back to "en".
tts:
  voices:
    en: en_US-ljspeech-high
    es: es_AR-daniela-high
  # CPU is intentional: Piper is fast enough without a GPU, and this avoids
  # VRAM contention with whisper.device: cuda above on a single GPU.
  device: cpu
  models_dir: "~/.local/share/claude-orchestrator/piper-voices"

redis:
  host: 127.0.0.1
  port: 6379
  incoming_channel: "whatsapp:incoming"
  outgoing_channel: "whatsapp:outgoing"

progress_updates:
  interval_seconds: 10

bridge:
  # Node bridge only.
  auth_dir: "~/.local/share/whatsapp-bridge/auth"
  staging_dir: "/tmp/whatsapp-bridge/incoming"
  # Shared: the Python orchestrator writes synthesized voice-reply audio
  # here; the Node bridge reads it, sends it, and deletes it (SPEC.md §7.4).
  outgoing_staging_dir: "/tmp/whatsapp-bridge/outgoing"

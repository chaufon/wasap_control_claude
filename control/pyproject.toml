[project]
name = "wasap-control"
version = "0.1.0"
description = "Claude Code remote control via WhatsApp — Python orchestrator"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "faster-whisper>=1.0",
    "piper-tts>=1.6",
    "langdetect>=1.0",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.24.0.43",
]

[project.scripts]
wasap-control = "wasap_control.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wasap_control"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

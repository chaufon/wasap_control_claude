[project]
name = "wasap-grill-me"
version = "0.1.0"
description = "Claude Code remote control via WhatsApp — Python orchestrator"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0",
    "pyyaml>=6.0",
    "faster-whisper>=1.0",
]

[project.scripts]
claude-orchestrator = "claude_orchestrator.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_orchestrator"]
